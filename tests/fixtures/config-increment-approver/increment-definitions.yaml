settings:
  ADDITIONAL_SETTING1: 'present'
  ADDITIONAL_SETTING2: 'also here'

product_increments:
- distri: foo
  project_base: FOO
  build_project_suffix: TEST
  build_listing_sub_path: product
  build_regex: 'some.*regex'
  product_regex: '^Foo.*'
  archs:
  - aarch64
  - ppc64le
  - x86_64
  packages:
  - kernel-source
  - kernel-azure
  settings:
    FOO: bar
  reference_repos:
    SLES: http://download.suse.de/ibs/Products/SLES/16.0
  additional_builds:
  - build_suffix: kernel-livepatch
    regex: 'kernel-livepatch-(?P<kernel_version>[^-]+(?:-[^-]+)?)(?:-(?P<kind>rt))?$'
    settings:
      FLAVOR: Base-RT-Updates
      KGRAFT: '1'
  - build_suffix: kernel-livepatch
    regex: 'kernel-livepatch-(?P<kernel_version>[^-]+(?:-[^-]+)?)(?:-(?P<kind>[^-]+))?$'
    settings:
      FLAVOR: Default-qcow-Updates
      KGRAFT: '1'
- distri: bar
  version: '42'
  flavor: 'Test-Increments'
  project_base: ''
  build_project_suffix: ToTest
  build_listing_sub_path: product/iso
  build_regex: 'another.*regex'
  product_regex: '^Bar-.*'
