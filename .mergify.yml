---
merge_queue:
  max_parallel_checks: 1
  status_comments: none
  queue_controls_comment: false

queue_rules:
  - name: default
    batch_size: 1

pull_request_rules:
  - name: automatic merge
    conditions:
      - and: &base_checks
        - base=master
        - -label~=^acceptance-tests-needed|not-ready
        - "#check-failure=0"
        - "#check-pending=0"
        - linear-history
      - and:
        - "#approved-reviews-by>=2"
        - "#changes-requested-reviews-by=0"
    actions: &merge
      merge:
        method: fast-forward
  - name: automatic merge on special label
    conditions:
      - and: *base_checks
      - and:
          - "label=merge-fast"
    actions: *merge
  - name: automatic merge for dependabot updates that only bump dependencies
    conditions:
      - and: *base_checks
      - and: &bot_gate
          - author=dependabot[bot]
          - "#changes-requested-reviews-by=0"
      # A commit pushed on top of the bot's own is a code change, not a bump
      - "#commits=1"
      # A bump writes manifests and action revisions only; a hand edit inside
      # the bot's own commit still passes, which this config does not cover
      - -files~=^(?!(uv\.lock|pyproject\.toml|\.github/workflows/[^/]+\.ya?ml)$).+
    actions: &squash
      queue:
      merge:
        method: squash
  - name: require review for other dependabot updates
    conditions:
      # One approval, not the base rule's two: the reviewer has to see the code
      # change riding along, not re-review the bump
      - and: *base_checks
      - and: *bot_gate
      - "#approved-reviews-by>=1"
    actions: *squash
  - name: continuously rebase pull requests when it's labeled with `rebase`
    conditions:
      - label=rebase
    actions:
      rebase:
        bot_account: suse-qe-tools-mergify
